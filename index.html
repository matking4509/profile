<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mat King - Strategic Tech Executive</title>
    <style>
        /* CSS Variables */
        :root {
            --bg-color: #121212;
            --text-main: #f5f5f5;
            --text-muted: #888888;
            --accent: #FFD700;
        }

        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            line-height: 1.6;
            overflow: hidden;
            position: relative;
        }

        /* Background Logo Watermark */
        .bg-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55vw; 
            max-width: 650px;
            opacity: 0.04; /* Keeps it subtle against the dark background */
            z-index: 0;
            pointer-events: none; /* Prevents the image from blocking clicks */
        }

        .container {
            text-align: center;
            max-width: 650px;
            padding: 2rem;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease-out, transform 1s ease-out;
            z-index: 1;
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #greeting {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        h1 span {
            color: var(--accent);
        }

        p.bio {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
        }

        /* Links Grid */
        .links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; 
            gap: 1rem;
        }

        .link-btn {
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid var(--text-muted);
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            flex: 1 1 auto; 
            min-width: 120px;
            max-width: 180px; 
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--accent);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }

        .link-btn:hover {
            color: var(--bg-color);
            border-color: var(--accent);
        }

        .link-btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }
    </style>
</head>
<body>

    <img src="MK-Logo-bkup.png" alt="Mat King Logo" class="bg-logo">

    <div class="container" id="main-container">
        <div id="greeting">Hello</div>
        <h1>Mat <span>King</span></h1>
        <p class="bio">Common-sense tech leadership, practical management, and honest work philosophy, hammered out over a 25-year career.</p>
        
        <div class="links">
            <a href="about.html" class="link-btn">About Me</a>
            <a href="https://www.linkedin.com/in/mat-king-mba-7858717/" target="_blank" class="link-btn">LinkedIn</a>
            <a href="https://substack.com/@matkinginfo" target="_blank" class="link-btn">Substack</a>
            <a href="contact.html" class="link-btn">Contact Me</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Dynamic Greeting
            const greetingElement = document.getElementById('greeting');
            const hour = new Date().getHours();
            let greeting = 'Hello';

            if (hour < 12) {
                greeting = 'Good Morning';
            } else if (hour < 18) {
                greeting = 'Good Afternoon';
            } else {
                greeting = 'Good Evening';
            }

            greetingElement.textContent = greeting;

            // Fade-in animation
            setTimeout(() => {
                document.getElementById('main-container').classList.add('visible');
            }, 150);
        });
    </script>

</body>
</html>
