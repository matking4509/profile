<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Matthew King</title>
    <style>
        /* CSS Variables */
        :root {
            --bg-color: #121212;
            --text-main: #f5f5f5;
            --text-muted: #888888;
            --accent: #FFD700;
        }

        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.8;
            position: relative;
            padding: 2rem;
        }

        /* Background Logo Watermark */
        .bg-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50vw;
            max-width: 600px;
            opacity: 0.05;
            z-index: 0;
            pointer-events: none;
        }

        /* Content Container */
        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease-out, transform 1s ease-out;
            z-index: 1;
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        h1 span {
            color: var(--accent);
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .text-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .text-link:hover {
            color: #fff;
        }

        /* Form Styling */
        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            text-align: left;
            margin-bottom: 1.5rem;
        }

        input, textarea {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: var(--text-main);
            padding: 1rem;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* CAPTCHA Styling */
        .captcha-block {
            display: flex;
            align-items: center;
            gap: 1rem;
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 0.5rem 1rem;
            border-radius: 4px;
        }

        .captcha-block label {
            color: var(--text-main);
            font-weight: 600;
            white-space: nowrap;
            user-select: none; /* Prevents bots from easily highlighting the text */
        }

        .captcha-block input {
            background-color: transparent;
            border: none;
            border-bottom: 2px solid #555;
            padding: 0.5rem;
            border-radius: 0;
        }

        .captcha-block input:focus {
            border-bottom-color: var(--accent);
            border-top: none;
            border-left: none;
            border-right: none;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .link-btn {
            text-decoration: none;
            color: var(--text-main);
            background: transparent;
            border: 1px solid var(--text-muted);
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: inline-block;
            text-align: center;
            flex: 1 1 auto;
            min-width: 150px;
            max-width: 200px;
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--accent);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }

        .link-btn:hover {
            color: var(--bg-color);
            border-color: var(--accent);
        }

        .link-btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        /* Status Message */
        #form-status {
            font-weight: 500;
            margin-top: 1rem;
            height: 1.5rem; 
        }
    </style>
</head>
<body>

    <img src="MK-Logo.jpg" alt="Matthew King Logo Watermark" class="bg-logo">

    <div class="container" id="main-container">
        
        <h1>Get in <span>Touch</span></h1>
        <p>Send a message using the form below, or email me directly at <a href="mailto:mat@matking.info" class="text-link">mat@matking.info</a>.</p>

        <form id="contact-form">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email Address" required>
            <textarea id="message" placeholder="How can I help you?" required></textarea>
            
            <div class="captcha-block">
                <label id="captcha-question" for="captcha-answer">What is ? + ?</label>
                <input type="number" id="captcha-answer" placeholder="Answer" required>
            </div>

            <div class="actions">
                <button type="submit" class="link-btn">Send Message</button>
                <a href="index.html" class="link-btn">Back to Home</a>
            </div>
        </form>

        <div id="form-status"></div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Fade-in animation on load
            setTimeout(() => {
                document.getElementById('main-container').classList.add('visible');
            }, 150);

            const contactForm = document.getElementById('contact-form');
            const formStatus = document.getElementById('form-status');
            const submitBtn = contactForm.querySelector('button[type="submit"]');
            
            // CAPTCHA Variables
            const captchaQuestion = document.getElementById('captcha-question');
            const captchaAnswer = document.getElementById('captcha-answer');
            let expectedAnswer = 0;

            // Function to generate a new math question
            function generateCaptcha() {
                const num1 = Math.floor(Math.random() * 10) + 1; // Random number 1-10
                const num2 = Math.floor(Math.random() * 10) + 1; // Random number 1-10
                expectedAnswer = num1 + num2;
                captchaQuestion.textContent = `Security Check: What is ${num1} + ${num2}?`;
                captchaAnswer.value = ''; // Clear previous answer
            }

            // Initialize CAPTCHA on page load
            generateCaptcha();

            // PASTE YOUR GOOGLE WEB APP URL HERE
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxbgArqF_tqc7cCuJBbXAfg22YFvLUMkX8wsqfbEv9qEfhnI3G2t2VmuLc3m0mn9cu8mg/exec';

            contactForm.addEventListener('submit', function(e) {
                e.preventDefault(); 

                // 1. Verify CAPTCHA first
                if (parseInt(captchaAnswer.value) !== expectedAnswer) {
                    formStatus.style.color = "#ff4444";
                    formStatus.textContent = "Incorrect security answer. Please try again.";
                    generateCaptcha(); // Reset the question to prevent brute-forcing
                    captchaAnswer.focus();
                    return; // Stop the form from submitting
                }

                // 2. If CAPTCHA is passed, proceed with sending
                formStatus.style.color = "var(--text-main)";
                formStatus.textContent = "Sending message...";
                submitBtn.disabled = true; 
                submitBtn.style.opacity = "0.5";

                const formData = new FormData();
                formData.append('name', document.getElementById('name').value);
                formData.append('email', document.getElementById('email').value);
                formData.append('message', document.getElementById('message').value);

                fetch(scriptURL, { method: 'POST', body: formData })
                    .then(response => {
                        formStatus.style.color = "var(--accent)";
                        formStatus.textContent = "Message sent successfully! I will get back to you soon.";
                        contactForm.reset(); 
                        generateCaptcha(); // Generate a new question for the next submission
                        
                        submitBtn.disabled = false;
                        submitBtn.style.opacity = "1";

                        setTimeout(() => {
                            formStatus.textContent = "";
                        }, 5000);
                    })
                    .catch(error => {
                        formStatus.style.color = "#ff4444"; 
                        formStatus.textContent = "Something went wrong. Please try the direct email link.";
                        console.error('Error!', error.message);
                        
                        submitBtn.disabled = false;
                        submitBtn.style.opacity = "1";
                    });
            });
        });
    </script>

</body>
</html>
